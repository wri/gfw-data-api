name: Run tests and apply terraform changes for current branch

on: [push]

jobs:
  test:
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: test
            cobertura: tests/cobertura.xml
          - suite: test_v2
            cobertura: tests_v2/cobertura.xml
    steps:
      - uses: actions/checkout@v5

      - name: Test with pytest (${{ matrix.suite }})
        run: ./scripts/${{ matrix.suite }} --do-cov --show-warnings

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: ${{ matrix.cobertura }}

  coverage:
    needs: test
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@master
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-artifacts/coverage-test/cobertura.xml, coverage-artifacts/coverage-test_v2/cobertura.xml

      - name: Run CodeCOV action
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-artifacts/coverage-test/cobertura.xml, coverage-artifacts/coverage-test_v2/cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

  deploy:
    needs: [test, coverage]
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v5

      # terraform apply builds the Batch Docker images (universal_batch.dockerfile,
      # pixetl.dockerfile) as multi-arch (amd64 + arm64) manifests via
      # terraform/scripts/buildx_push.sh, invoked from inside the
      # globalforestwatch/terraform container against this runner's Docker
      # daemon (bind-mounted socket). Registering QEMU here makes the host
      # kernel able to run arm64 binaries so that build can happen via
      # emulation on this x86_64 runner. This step is a no-op for everything
      # else in the deploy (the FastAPI/ECS image build is unaffected).
      - name: Set up QEMU (for multi-arch Batch image builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Deploy production
        if: success() && (github.ref_name == 'master')
        env:
          ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_production }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_production }}
          AWS_REGION: ${{ secrets.aws_region_production }}
        run: |
          ./scripts/infra plan -w ${{ github.ref }}
          ./scripts/infra apply

      - name: Deploy staging
        if: success() && (github.ref_name == 'develop')
        env:
          ENV: staging
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_staging }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_staging }}
          AWS_REGION: ${{ secrets.aws_region_staging }}
        run: |
          ./scripts/infra plan -w ${{ github.ref }}
          ./scripts/infra apply

      - name: Deploy dev
        if: success() && (github.ref_name != 'develop') && (github.ref_name != 'master')
        env:
          ENV: dev
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_dev }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret_dev }}
          AWS_REGION: ${{ secrets.aws_region_dev }}
        run: |
          ./scripts/infra plan -w ${{ github.ref }}
          ./scripts/infra apply
