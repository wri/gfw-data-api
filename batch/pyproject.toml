[project]
name = "gfw-data-api-batch"
version = "0.1.0"
description = "Standalone dependency set for the universal_batch Docker image used to run AWS Batch jobs for the GFW Data API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agate~=1.12.0",
    "asyncpg~=0.30.0",
    "awscli~=1.36.18",
    "awscli-plugin-endpoint~=0.4",
    "boto3~=1.35.77",
    "click~=8.1.7",
    "csvkit~=2.0.1",
    "earthengine-api~=0.1.408",
    "fiona~=1.9.6",
    "gsutil~=5.31",
    "numpy~=2.2.6",
    "pandas==2.3.2",
    "psycopg2~=2.9.12",
    "rasterio~=1.5.1",
    "setuptools~=83.0.0",
    "shapely~=2.1.2",
    "SQLAlchemy>=2.0,<2.1",
    "tileputty~=0.2.10"
]

[tool.uv]
package = false
