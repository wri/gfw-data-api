[project]
name = "gfw-data-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~= 3.11.0"
dependencies = [
    "aenum",
    "aiofiles",
    "aiohttp",
    "alembic",
    "arq",
    "asgi_lifespan",
    "async-lru",
    "asyncpg",
    "boto3",
    "botocore",
    "email-validator",
    "fastapi>=0.119.0",
    "geoalchemy2<0.12",
    "geojson",
    "gino",
    "gino_starlette",
    "google-cloud-storage",
    "gunicorn",
    "httpcore",
    "httpx",
    "httpx-auth",
    "newrelic",
    "numpy<2",
    "openapi_spec_validator",
    "orjson",
    "packaging",
    "pendulum<3",
    "pglast",
    "psutil",
    "psycopg2",
    "pydantic<2",
    "pyproj",
    "python-multipart",
    "retrying",
    "shapely",
    "sqlalchemy<1.4",
    "sqlalchemy-utils",
    "starlette",
    "typer",
    "unidecode",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "asgi-lifespan",
    "docker",
    "moto[awslambda, batch, ec2, s3, secretsmanager]<5",
    "pre-commit",
    "pytest<9",
    "pytest-asyncio<1",
    "pytest-cov",
    "pytest-timeout",
    "pytest-unordered>=0.6.1",
    "rasterio==1.4.3",
]

[tool.setuptools]
packages = ["app", "batch"]
